<style>
:root{--accent:#3a4a6b;--bg:#f6f3ee;--ink:#1f2430;--muted:#5b6472;--card:#fff;--line:#d7dde5;--soft:#e8eef5;--warn:#7a4b12;--warn-bg:#fff4e5;}
*{box-sizing:border-box} body{margin:0;font-family:Sarabun,Noto Sans Thai,Tahoma,sans-serif;background:radial-gradient(circle at top right,#e8eef5 0%,transparent 40%),linear-gradient(180deg,#f8fafc 0%,var(--bg) 100%);color:var(--ink);line-height:1.65;padding:1rem 1rem 3rem}

section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.9rem}
h2{margin:0 0 .65rem;font-size:1.05rem;color:var(--accent)} h3{margin:1rem 0 .4rem;font-size:1rem}
.table-wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:280px}
th,td{border:1px solid var(--line);padding:.5rem;vertical-align:top;text-align:left} th{background:var(--soft)}
.tip{background:var(--warn-bg);color:var(--warn);border-left:4px solid #e0a454;border-radius:10px;padding:.7rem;margin:.7rem 0;font-size:.92rem}
code{background:#eef2f6;padding:.05rem .3rem;border-radius:5px}

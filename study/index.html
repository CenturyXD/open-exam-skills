<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>เมนูชุดเรียนสอบกฎหมาย</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --ink: #1c2430;
      --muted: #5d6673;
      --card: #ffffff;
      --line: #ddd6cb;
      --a: #0f5c4c;
      --b: #1a4f7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Sarabun", "Noto Sans Thai", "Tahoma", sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background:
        radial-gradient(circle at top right, #ebe4d8 0%, transparent 42%),
        linear-gradient(180deg, #faf8f4 0%, var(--bg) 100%);
      padding: 1rem 1rem 2.5rem;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #1f3b4d, #2f5d4a);
      color: #fff;
      border-radius: 20px;
      padding: 1.35rem 1.2rem;
      box-shadow: 0 12px 28px rgba(31, 59, 77, 0.22);
      margin-bottom: 1rem;
    }
    header h1 { margin: 0 0 0.35rem; font-size: 1.32rem; line-height: 1.3; }
    header p { margin: 0; opacity: 0.95; font-size: 0.95rem; }
    .hint { margin: 0.85rem 0 1rem; color: var(--muted); font-size: 0.92rem; }
    .pack {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
      margin-bottom: 0.85rem;
    }
    .pack-head { display: flex; gap: 0.75rem; align-items: flex-start; margin-bottom: 0.75rem; }
    .badge {
      flex: 0 0 auto; min-width: 2.3rem; height: 2.3rem; border-radius: 12px;
      display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--b);
      font-size: 0.85rem; padding: 0 0.35rem;
    }
    .pack:first-child .badge { background: #5a2a4a; }
    .pack:first-child .menu a.primary { background: #f3e8ef; border-color: #d4b3c6; }
    .pack:nth-child(odd) .badge { background: var(--a); }
    .pack-title { margin: 0; font-size: 1.02rem; line-height: 1.35; }
    .pack-sub { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.86rem; }
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .menu a {
      display: block; text-decoration: none; border-radius: 14px; padding: 0.8rem 0.75rem;
      border: 1px solid var(--line); background: #fbfaf7; color: var(--ink);
    }
    .menu a.primary { background: #e8f0f7; border-color: #b7cfe0; }
    .item-label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--b); margin-bottom: 0.15rem; }
    .item-name { display: block; font-size: 0.96rem; font-weight: 700; line-height: 1.3; }
    .item-desc { display: block; margin-top: 0.15rem; color: var(--muted); font-size: 0.8rem; }
    .full { grid-column: 1 / -1; }
    footer { margin-top: 1rem; text-align: center; color: var(--muted); font-size: 0.84rem; }
    @media (max-width: 560px) { .menu { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>เมนูชุดเรียนสอบกฎหมาย</h1>
      <p>เลือกหัวข้อ แล้วเปิดสรุป / แผนที่ความคิด / บัตรคำ / ข้อสอบ (5 ชุด × 30 ข้อ)</p>
    </header>
    <p class="hint">แนะนำลำดับ: สรุป → แผนที่ความคิด → บัตรคำ → ข้อสอบ</p>

    <!-- packs injected -->
    <div id="packs"></div>
    <footer>กดเมนูแต่ละอันเพื่อเปิดดู · ควิซทุกหัวข้อเป็น 5 ชุด ชุดละ 30 ข้อ</footer>
  </div>
  <script>
    const BRANCH = "cursor/court-justice-admin-act-7242";
    const REPO = "CenturyXD/open-exam-skills";
    const packs = [
      { n: 0, slug: "combined-all-topics", title: "ข้อสอบรวมทุกหัวข้อ", sub: "คละทุกหัวข้อ · ฝึกแบบสอบรวม · 5 ชุด × 30 ข้อ" },
      { n: 1, slug: "civil-service-act-2551", title: "พ.ร.บ.ระเบียบข้าราชการพลเรือน พ.ศ. 2551", sub: "นิยาม · ก.พ./ก.พ.ค. · จรรยา · วินัย · คุณธรรม" },
      { n: 2, slug: "court-of-justice-admin", title: "พ.ร.บ.ระเบียบบริหารราชการศาลยุติธรรม พ.ศ. 2543", sub: "สำนักงานศาลยุติธรรม · ก.บ.ศ. · ก.ศ. · เลขาธิการ · แก้ไข 2–4" },
      { n: 3, slug: "jcac-regulations", title: "ระเบียบ ประกาศ คำสั่ง ของ ก.บ.ศ.", sub: "อำนาจ ม.17 · งบประมาณ พัสดุ · แบบพิมพ์ · เบี้ยประชุม" },
      { n: 4, slug: "jcsc-regulations", title: "ระเบียบ ประกาศ คำสั่ง ของ ก.ศ.", sub: "งานบุคคลข้าราชการศาลยุติธรรม · บรรจุแต่งตั้ง · วินัย" },
      { n: 5, slug: "oj-regulations", title: "ระเบียบ ประกาศ คำสั่ง ของสำนักงานศาลยุติธรรม", sub: "เลขาธิการ · ประกาศวิธีปฏิบัติ · ระบบอิเล็กทรอนิกส์" },
      { n: 6, slug: "sc-president-it", title: "ข้อกำหนดประธานศาลฎีกาด้านเทคโนโลยีสารสนเทศ", sub: "พิจารณาคดีทางอิเล็กทรอนิกส์ 2563 · e-Filing · ลายมือชื่ออิเล็กทรอนิกส์" },
      { n: 7, slug: "it-laws-policies", title: "กฎหมาย กฎ ระเบียบ นโยบายด้านเทคโนโลยีสารสนเทศ", sub: "ธุรกรรมอิเล็กทรอนิกส์ · คอมพิวเตอร์ · PDPA · ไซเบอร์ · รัฐบาลดิจิทัล" },
      { n: 8, slug: "civil-service-laws", title: "ชุดรวม: กฎหมายปฏิบัติราชการ (หลายฉบับ)", sub: "ข้าราชการ · จริยธรรม · บ้านเมืองที่ดี · ละเมิด · ข้อมูลข่าวสาร ฯลฯ" },
    ];

    function href(path) {
      const onPreview = /htmlpreview\.github\.io/i.test(location.hostname);
      if (onPreview) {
        return "https://htmlpreview.github.io/?https://github.com/" + REPO + "/blob/" + BRANCH + "/study/" + path;
      }
      return path;
    }

    const root = document.getElementById("packs");
    root.innerHTML = packs.map(p => `
      <section class="pack">
        <div class="pack-head">
          <div class="badge">${p.n === 0 ? "รวม" : p.n}</div>
          <div>
            <h2 class="pack-title">${p.title}</h2>
            <p class="pack-sub">${p.sub}</p>
          </div>
        </div>
        <div class="menu">
          <a class="primary full" href="${href(p.slug + '/summary.html')}">
            <span class="item-label">เริ่มที่นี่</span>
            <span class="item-name">สรุปเนื้อหา</span>
            <span class="item-desc">อ่านทีละหมวด</span>
          </a>
          <a href="${href(p.slug + '/mindmap.html')}">
            <span class="item-label">โครงสร้าง</span>
            <span class="item-name">แผนที่ความคิด</span>
          </a>
          <a href="${href(p.slug + '/flashcards.html')}">
            <span class="item-label">ท่องจำ</span>
            <span class="item-name">บัตรคำ</span>
          </a>
          <a class="full" href="${href(p.slug + '/quiz.html')}">
            <span class="item-label">ทดสอบ</span>
            <span class="item-name">ข้อสอบ / ควิซ</span>
            <span class="item-desc">5 ชุด ชุดละ 30 ข้อ · เลือกชุดได้</span>
          </a>
        </div>
      </section>
    `).join("");
  </script>
</body>
</html>
